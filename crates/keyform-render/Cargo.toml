[package]
name = "keyform-render"
description = "Keyform renderer: deterministic CPU reference rasterizer (and GPU path)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
keyform-model.workspace = true
keyform-eval.workspace = true
keyform-formats.workspace = true
png.workspace = true
thiserror.workspace = true

wgpu = { version = "30", optional = true }
pollster = { version = "1", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[lints]
workspace = true
