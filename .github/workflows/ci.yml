name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries (windowing for the app crate)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - run: cargo clippy --workspace --all-targets --locked
      # Sample-model tests pass vacuously without KEYFORM_SAMPLES (licensed
      # data is never in the repository); GPU tests skip without an adapter.
      - run: cargo test --workspace --locked
      # Every file type opens with the hidden --check-open (no window), on
      # each platform, from files made from the committed original PSD.
      - run: cargo build --locked -p keyform-app -p keyform-cli
      - name: Open each file type
        shell: bash
        run: |
          tools/e2e/make_fixtures.sh target/debug/kf fixtures
          for f in fixtures/character.cmo3 fixtures/character.can3 fixtures/runtime/character.moc3 fixtures/runtime/character.model3.json test-data/e2e/character.psd; do
            target/debug/keyform --check-open "$f"
          done
      - name: Linux desktop integration (xdg-mime)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y desktop-file-utils shared-mime-info xdg-utils libglib2.0-bin
          packaging/linux/test-desktop-integration.sh target/debug/keyform fixtures/character.cmo3
