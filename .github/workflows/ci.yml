name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries (windowing for the app crate)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - run: cargo clippy --workspace --all-targets --locked
      # Sample-model tests pass vacuously without KEYFORM_SAMPLES (licensed
      # data is never in the repository); GPU tests skip without an adapter.
      - run: cargo test --workspace --locked
      # Every file type opens with the hidden --check-open (no window), on
      # each platform, from files made from the committed original PSD.
      - run: cargo build --locked -p keyform-app -p keyform-cli
      - name: Open each file type
        shell: bash
        run: |
          tools/e2e/make_fixtures.sh target/debug/kf fixtures
          for f in fixtures/character.cmo3 fixtures/character.can3 fixtures/runtime/character.moc3 fixtures/runtime/character.model3.json test-data/e2e/character.psd; do
            target/debug/keyform --check-open "$f"
          done
      # The UI map and scripted file dialogs are test hooks: release builds
      # must ignore their environment variables.
      - name: Release builds ignore the test hooks
        if: runner.os == 'Linux'
        run: cargo test --release --locked -p keyform-app --bin keyform ignored_in_release
      - name: Linux desktop integration (xdg-mime)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y desktop-file-utils shared-mime-info xdg-utils libglib2.0-bin
          packaging/linux/test-desktop-integration.sh target/debug/keyform fixtures/character.cmo3

  # The scripted rigging session on the committed original PSD: real mouse
  # and keyboard input on a private Xvfb display, then the output checks
  # (files open, re-save unchanged, every parameter moves the render,
  # golden snapshots, physics, motion). Debug builds: the UI map and the
  # scripted file dialogs are compiled out of release builds.
  e2e:
    runs-on: ubuntu-latest
    env:
      KEYFORM_E2E_DISPLAY: ":99"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries, Xvfb, software rendering, Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev \
            xvfb mesa-vulkan-drivers libgl1-mesa-dri python3-xlib python3-pil
      - run: cargo build --locked -p keyform-app -p keyform-cli
      - name: Scripted rigging session
        run: |
          tools/e2e/display.sh start
          timeout 2400 python3 -I tools/e2e/session.py test-data/e2e/character.psd e2e-out \
            --keyform target/debug/keyform --display :99
      - name: Check the outputs
        run: |
          python3 -I tools/e2e/check.py e2e-out --keyform target/debug/keyform --kf target/debug/kf \
            --golden test-data/e2e/golden
      - name: Reachability audit
        run: |
          [ -S /tmp/.X11-unix/X99 ] || tools/e2e/display.sh start
          timeout 2700 python3 -I tools/e2e/audit.py e2e-out/audit --keyform target/debug/keyform \
            --display :99 --doc docs/reachability.md --check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-session
          path: |
            e2e-out/*.png
            e2e-out/*.gif
            e2e-out/*.json
            e2e-out/snapshots
            e2e-out/keyform.log
            e2e-out/audit
          if-no-files-found: ignore
